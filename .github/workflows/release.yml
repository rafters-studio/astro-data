name: Release

# Triggered by pushing a v* tag. First publish of the package was manual
# (under maintainer account); from then on releases flow through OIDC
# trusted publishing.
#
# OIDC gotchas (recall from mail + rafters):
# - Do NOT set registry-url on setup-node. It writes a .npmrc that
#   blocks OIDC auth by forcing token-based publishing.
# - Do NOT set NODE_AUTH_TOKEN in the publish step env. Any value
#   (including empty) short-circuits the OIDC path.
# - The id-token: write permission is required.
# - --provenance triggers the OIDC exchange with npmjs.org.
on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          # Intentionally no registry-url. See OIDC gotchas in file header.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: npm publish --access=public --provenance
        # Intentionally no NODE_AUTH_TOKEN. See OIDC gotchas in file header.

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
